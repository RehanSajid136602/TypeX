<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E232A" />
      <stop offset="100%" stop-color="#0B0C10" />
    </radialGradient>
    <linearGradient id="keyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#222831" />
      <stop offset="100%" stop-color="#111418" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#F59E0B" stroke-opacity="0.25" stroke-width="4"/>

  <!-- Keycap Silhouette -->
  <rect x="64" y="64" width="384" height="384" rx="72" fill="url(#keyGrad)" filter="url(#shadow)" stroke="#393E46" stroke-width="6"/>

  <!-- Keycap Dish Inset -->
  <rect x="96" y="96" width="320" height="320" rx="52" fill="#161A1E" stroke="#252A30" stroke-width="3"/>

  <!-- Type 'T' Graphic -->
  <path d="M 160 176 L 352 176 L 352 216 L 280 216 L 280 344 L 232 344 L 232 216 L 160 216 Z" fill="#EEEEEE"/>

  <!-- Vibrant Accent 'X' Kinetic Slash -->
  <path d="M 288 232 L 368 344 L 332 344 L 268 252 Z" fill="url(#amberGrad)"/>
  <path d="M 336 232 L 368 232 L 288 344 L 256 344 Z" fill="#FBBF24"/>

  <!-- Modern Telemetry Dot / Accent -->
  <circle cx="368" cy="176" r="14" fill="#06B6D4"/>
</svg>
