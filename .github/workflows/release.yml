name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v0.3.1)'
        required: false
        default: 'v0.3.1'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (.deb & .tar.gz)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential dpkg-dev

      - name: Determine version tag
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Install frontend dependencies
        run: |
          cd frontend
          pnpm install --frozen-lockfile || pnpm install

      - name: Package Debian (.deb)
        run: |
          chmod +x scripts/build_deb.sh
          ./scripts/build_deb.sh "${{ steps.vars.outputs.version }}"

      - name: Package Tarball (.tar.gz)
        run: |
          mkdir -p dist/typex-${{ steps.vars.outputs.tag }}-linux-x86_64
          cp backend/typex_server dist/typex-${{ steps.vars.outputs.tag }}-linux-x86_64/
          cp -r backend/data dist/typex-${{ steps.vars.outputs.tag }}-linux-x86_64/
          if [ -d frontend/out ]; then
            cp -r frontend/out dist/typex-${{ steps.vars.outputs.tag }}-linux-x86_64/web
          fi
          cd dist
          tar -czf typex-${{ steps.vars.outputs.tag }}-linux-x86_64.tar.gz typex-${{ steps.vars.outputs.tag }}-linux-x86_64

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            dist/*.deb
            dist/*.tar.gz

  build-windows:
    name: Build Windows Desktop (.exe installer)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Determine version tag
        id: vars
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Install frontend dependencies
        shell: bash
        run: |
          cd frontend
          pnpm install --frozen-lockfile || pnpm install

      - name: Build frontend static distribution
        shell: bash
        run: |
          cd frontend
          pnpm exec next build

      - name: Build backend (CMake, Release)
        shell: pwsh
        run: |
          cmake -S . -B build/backend -DCMAKE_BUILD_TYPE=Release
          cmake --build build/backend --config Release --parallel
          $exe = Get-ChildItem -Path build/backend -Recurse -Filter "typex_server.exe" | Select-Object -First 1
          if (-not $exe) { throw "typex_server.exe not found after build" }
          New-Item -ItemType Directory -Force -Path desktop/backend/data | Out-Null
          Copy-Item $exe.FullName desktop/backend/typex_server.exe -Force
          Copy-Item backend/data/*.txt desktop/backend/data/ -Force
          if (Test-Path backend/data/WORDLISTS.md) { Copy-Item backend/data/WORDLISTS.md desktop/backend/data/ -Force }
          Get-ChildItem desktop/backend

      - name: Install desktop dependencies
        shell: bash
        run: |
          cd desktop
          pnpm install

      - name: Build Electron installer (NSIS, publish disabled)
        shell: bash
        env:
          # Code signing runs only when secrets are provided; skipped silently otherwise.
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          cd desktop
          pnpm exec electron-builder --win nsis --x64 --publish never -c.extraMetadata.version="${{ steps.vars.outputs.version }}"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            desktop/dist-electron/TypeX-*-Setup.exe

  publish-release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Inspect release assets
        run: |
          ls -lh release-assets/

      - name: Determine release tag
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "TypeX ${{ steps.vars.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
