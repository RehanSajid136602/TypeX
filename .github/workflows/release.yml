name: Release

# Tag push (v*.*.*) -> build both installers and publish a GitHub Release.
# Manual run -> build both installers, upload them as workflow artifacts only.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Semver tag to build (e.g. v1.2.0 or v1.2.0-beta.1). Manual runs never publish a release.'
        required: true
        default: 'v0.3.1'

permissions:
  contents: read

# Two runs for the same tag must never overlap.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Fail fast on tags that are not valid semver and expose the version everywhere.
  prepare:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.semver.outputs.tag }}
      version: ${{ steps.semver.outputs.version }}
      prerelease: ${{ steps.semver.outputs.prerelease }}
    steps:
      - name: Resolve and validate semver tag
        id: semver
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG}" ]; then TAG="${INPUT_TAG}"; else TAG="${REF_NAME}"; fi

          if ! printf '%s' "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.]+)?(\+[0-9A-Za-z.]+)?$'; then
            echo "::error::Tag '${TAG}' is not a valid semver tag. Expected v<major>.<minor>.<patch>, optionally with a -prerelease suffix (e.g. v1.2.0 or v1.2.0-beta.1)."
            exit 1
          fi

          # Build metadata (+...) is valid semver but is dropped from file names.
          VERSION="${TAG#v}"
          VERSION="${VERSION%%+*}"

          PRERELEASE=false
          case "$VERSION" in *-*) PRERELEASE=true ;; esac

          {
            echo "tag=${TAG}"
            echo "version=${VERSION}"
            echo "prerelease=${PRERELEASE}"
          } >> "$GITHUB_OUTPUT"

          echo "Building TypeX ${VERSION} (tag ${TAG}, prerelease ${PRERELEASE})"

  build-linux:
    name: Build Linux (.deb)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        # pnpm/action-setup v4 (pinned to a full commit SHA)
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 9

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential dpkg-dev

      - name: Install frontend dependencies
        run: |
          cd frontend
          pnpm install --frozen-lockfile

      - name: Package Debian (.deb)
        # scripts/build_deb.sh writes the version into the control file and emits
        # typex_<version>_amd64.deb.
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          chmod +x scripts/build_deb.sh
          ./scripts/build_deb.sh "$VERSION"

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: dist/typex_${{ needs.prepare.outputs.version }}_amd64.deb
          if-no-files-found: error

  build-windows:
    name: Build Windows (.exe installer)
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        # pnpm/action-setup v4 (pinned to a full commit SHA)
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 9

      - name: Install frontend dependencies
        shell: bash
        run: |
          cd frontend
          pnpm install --frozen-lockfile

      - name: Build frontend static distribution
        shell: bash
        run: |
          cd frontend
          pnpm exec next build

      - name: Build backend (CMake, Release)
        shell: pwsh
        run: |
          cmake -S . -B build/backend -DCMAKE_BUILD_TYPE=Release
          cmake --build build/backend --config Release --parallel
          $exe = Get-ChildItem -Path build/backend -Recurse -Filter "typex_server.exe" | Select-Object -First 1
          if (-not $exe) { throw "typex_server.exe not found after build" }
          New-Item -ItemType Directory -Force -Path desktop/backend/data | Out-Null
          Copy-Item $exe.FullName desktop/backend/typex_server.exe -Force
          Copy-Item backend/data/*.txt desktop/backend/data/ -Force
          if (Test-Path backend/data/WORDLISTS.md) { Copy-Item backend/data/WORDLISTS.md desktop/backend/data/ -Force }
          Get-ChildItem desktop/backend

      - name: Stamp installer version from tag
        # Never committed: this only mutates the checked-out working tree.
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cd desktop
          pnpm pkg set version="$VERSION"
          pnpm pkg get version

      - name: Install desktop dependencies
        shell: bash
        run: |
          cd desktop
          pnpm install

      - name: Verify NSIS include is present
        # electron-builder resolves nsis.include="build/installer.nsh" relative to
        # buildResources (desktop/build). That file is tracked explicitly because the
        # repository-wide "build/" ignore rule would otherwise drop it from checkout.
        shell: bash
        run: |
          test -f desktop/build/installer.nsh || {
            echo "::error::desktop/build/installer.nsh is missing from the checkout"
            exit 1
          }
          cat desktop/build/installer.nsh

      - name: Build Electron installer (NSIS, publish disabled)
        shell: bash
        env:
          # Code signing runs only when secrets are provided; skipped silently otherwise.
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          cd desktop
          pnpm exec electron-builder --win nsis --x64 --publish never \
            -c.artifactName='TypeX-Setup-${version}-x64.${ext}'

      - name: Upload .exe installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: desktop/dist-electron/TypeX-Setup-${{ needs.prepare.outputs.version }}-x64.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [prepare, build-linux, build-windows]
    # Tag pushes only; manual runs stop after the artifact uploads.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          ls -l
          cat SHA256SUMS.txt

      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::A GitHub Release for '$TAG' already exists. Delete it first or publish a new version tag — this workflow will not overwrite it."
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          args=(--title "TypeX $TAG" --generate-notes)
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" release-assets/* "${args[@]}"
